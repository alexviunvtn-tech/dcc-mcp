plugins = ["krita", "blender", "capcut"]
recipes_dir = "recipes"
work_dir = "work"            # imported files and their versions; or set DCC_MCP_WORK_DIR

[krita]
exe = 'C:\Program Files\Krita (x64)\bin\krita.exe'   # Linux/macOS: path to your krita binary
default_mode = "live"        # only live for now: the bridge runs inside an open Krita window
allow_raw = false            # true enables krita.python: any Python inside Krita, full API
# start_timeout = 90         # seconds to wait for Krita and the bridge after launching
# call_timeout = 300         # seconds one command may take (big filters)

[blender]
exe = 'C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'   # Linux/macOS: path to your blender binary
default_mode = "headless"    # only headless for now: every call is its own `blender -b`
allow_raw = false            # true enables blender.python: any bpy script in background Blender
# call_timeout = 600         # seconds one call may take (big renders)

[capcut]
# drafts_dir = 'C:\Users\<you>\AppData\Local\CapCut\User Data\Projects\com.lveditor.draft'   # this is the default
ffprobe = "ffprobe"          # or the full path to ffprobe.exe (from ffmpeg); reads the length and size of media files
allow_raw = false            # true enables capcut.raw: deep-merge any JSON into a draft
