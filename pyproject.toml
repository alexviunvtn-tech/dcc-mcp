[project]
name = "dcc-mcp"
version = "0.1.0"
description = "One MCP server for DCC programs, with programs as plugins: Krita and Blender"
license = "Apache-2.0"
requires-python = ">=3.11"   # tomllib
dependencies = ["mcp", "pyyaml", "jsonschema"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
